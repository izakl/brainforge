name: Check brain-factory

on:
  pull_request:
    paths:
      - "brain-factory/**"
      - "scripts/check-brain-factory.sh"
      - ".github/workflows/check-brain-factory.yml"

permissions:
  contents: read

jobs:
  check-brain-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Check brain-factory invariants
        run: bash scripts/check-brain-factory.sh
